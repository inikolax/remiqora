# Remiqora with docker compose on a Linux host with an NVIDIA GPU (driver + NVIDIA Container Toolkit):
#   docker compose up -d --build      then open http://127.0.0.1:9000
#   docker compose logs -f            the server's messages; YuE2's weights download on the first start (~10 GB)
#   docker compose down               stops it; the library, settings and weights stay in the remiqora-data volume
# Remiqora has no login: the port is published on 127.0.0.1 only. To open it to your network, change the "ports" line
# to "9000:9000" on a trusted network or put an authenticating reverse proxy in front of it.
services:
  remiqora:
    build:
      context: .
      args:
        IMAGE_VERSION: "0.5.1"
    image: remiqora:latest
    container_name: remiqora
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - remiqora-data:/data
    environment:
      # YuE2 precisions to download on the first start: q8_0, q4_0, bf16 (comma separated)
      YUE2_PRECISIONS: "q8_0"
    # the engines share memory with PyTorch's data loaders
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  remiqora-data:
