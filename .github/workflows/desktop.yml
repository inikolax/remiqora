name: Desktop app

# Builds the Electron installers. Pushes, pull requests and manual runs only keep the files as workflow artifacts.
# Pushing a tag vX.Y.Z also creates a DRAFT pre-release with the installers and their SHA-256 sums; nothing becomes
# public until the draft is published by hand. The installers are not signed yet.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifacts: |
              desktop/dist/*.exe
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifacts: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Unit tests
        run: npm test
        working-directory: desktop
      - name: Build installer
        run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # An app without a valid seal is reported as "damaged" once downloaded (#33); fail here instead.
      - name: Verify the ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Remiqora.app
          codesign --display --verbose=2 dist/mac-arm64/Remiqora.app
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with:
          name: remiqora-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the desktop version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/package.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Write checksums and release notes
        run: |
          cd installers
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<'NOTES'
          Experimental desktop installers for Windows (NVIDIA GPU) and macOS (Apple Silicon).

          - They have no certificate yet. Windows shows a SmartScreen warning ("More info" → "Run anyway"); on macOS allow the app once via System Settings → Privacy & Security → "Open Anyway".
          - The installer is small: the first launch downloads the engines and models (roughly 30 GB) into a folder you choose.
          - SHA-256 sums of every file are in `SHA256SUMS.txt`.

          Setup from scripts and the full list of limits are in the README.
          NOTES
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --draft --prerelease \
              --title "Remiqora ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
