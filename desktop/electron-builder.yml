appId: io.github.inikolax.remiqora
productName: Remiqora
copyright: Copyright © 2026 Nikolay Cherkashin
directories:
  output: dist
  buildResources: build
publish: null

files:
  - src/**
  - renderer/**
  - manifest.json
  - package.json
  - "!**/*.map"

# The backend runs from real files (Python cannot import from an asar archive). Its own sibling layout is kept:
# resources/backend and resources/frontend/dist.
extraResources:
  - from: resources/backend
    to: backend
  - from: resources/frontend
    to: frontend
  - from: resources/patches
    to: patches

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true            # per-user install, no administrator prompt
  perMachine: false
  deleteAppDataOnUninstall: false   # models and projects are the user's data, not ours to delete
  artifactName: Remiqora-Setup-${version}.${ext}
  shortcutName: Remiqora

mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.music
  icon: build/icon.png
  # Ad-hoc signing (no certificate). With identity null the renamed Electron bundle had no valid seal, and a
  # downloaded copy (quarantine flag set by the browser) was reported as "damaged" with no way to open it (#33).
  # An ad-hoc seal turns that into the usual "Apple could not verify" prompt, which the user passes once via
  # System Settings > Privacy & Security > Open Anyway. Hardened runtime stays off: without a Developer ID it
  # makes library validation reject Electron's frameworks. A Developer ID and notarization is the real fix.
  identity: "-"
  hardenedRuntime: false
  artifactName: Remiqora-${version}-${arch}.${ext}

# Packaging works; the first-run setup reports "unsupported" on Linux until it has scripts (see PR #2).
linux:
  target: [AppImage]
  category: AudioVideo
  icon: build/icon.png
  artifactName: Remiqora-${version}-${arch}.${ext}
